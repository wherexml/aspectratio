name: Ubuntu CI and Cloudflare deployment
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aspect-ratio-canvas-cloudflare
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: [self-hosted, Linux, ARM64, ubuntu-m3ultra, aspect-ratio-canvas]
    timeout-minutes: 25
    env:
      VITE_SITE_URL: https://aspect-ratio-canvas.geekmooc.workers.dev
      VITE_SITE_INDEXABLE: 'false'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned tools
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          npm install --prefix "$RUNNER_TEMP/tools" --no-audit --no-fund bun@1.3.11 wrangler@4.151.1
          echo "$RUNNER_TEMP/tools/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck and build
        run: |
          bunx tsc --noEmit
          bun run build
          node scripts/prepare-worker.mjs
      - name: Verify production artifact locally
        run: |
          mkdir -p ci-results
          wrangler dev --config .output/server/wrangler.json --local --ip 127.0.0.1 --port 18769 > ci-results/worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18769/robots.txt >/dev/null; then break; fi
            sleep 1
          done
          python3 scripts/verify-http.py http://127.0.0.1:18769 "$VITE_SITE_URL" > ci-results/local-http.json
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '43886d80333268731ba049d55af60272'
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          wrangler deploy --config .output/server/wrangler.json | tee ci-results/deploy.log
      - name: Verify public deployment
        run: |
          for attempt in $(seq 1 12); do
            if python3 scripts/verify-http.py "$VITE_SITE_URL" "$VITE_SITE_URL" > ci-results/public-http.json; then exit 0; fi
            sleep 5
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-evidence-${{ github.run_number }}
          path: ci-results/
          retention-days: 14
